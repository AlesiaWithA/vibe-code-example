<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will you be my valentine?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .font-barbie {
      font-family: 'Great Vibes', cursive;
    }
    .no-btn-runaway {
      transition: left 0.18s ease-out, top 0.18s ease-out, transform 0.18s ease-out, opacity 0.3s ease-out;
    }
    .yes-btn-grow {
      transition: transform 0.25s ease-out;
    }

    /* Yes button: sparkle and shake by stage */
    .yes-sparkle {
      animation: yes-sparkle 1.5s ease-in-out infinite;
    }
    .yes-sparkle-more {
      animation: yes-sparkle 0.8s ease-in-out infinite;
    }
    .yes-shake {
      animation: yes-shake 0.4s ease-in-out infinite;
    }
    @keyframes yes-sparkle {
      0%, 100% { box-shadow: 0 0 12px rgba(244, 114, 182, 0.6); filter: brightness(1); }
      50% { box-shadow: 0 0 24px rgba(244, 114, 182, 0.9); filter: brightness(1.15); }
    }
    @keyframes yes-shake {
      0%, 100% { transform: scale(var(--yes-scale, 1)) translateX(0); }
      25% { transform: scale(var(--yes-scale, 1)) translateX(-4px); }
      75% { transform: scale(var(--yes-scale, 1)) translateX(4px); }
    }

    /* Background sparkles */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, #fff 30%, rgba(255, 182, 193, 0.8) 70%, transparent);
      border-radius: 50%;
      animation: sparkle-shine 2s ease-in-out infinite;
    }
    .sparkle::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: inherit;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.6;
    }
    @keyframes sparkle-shine {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    /* Falling hearts - start immediately */
    .heart-fall {
      position: absolute;
      font-size: 1rem;
      opacity: 0.7;
      animation: heart-fall linear infinite;
      pointer-events: none;
    }
    @keyframes heart-fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    /* Flying pink bats */
    .bat-fly {
      position: absolute;
      font-size: 1.5rem;
      pointer-events: none;
      opacity: 0.55;
      animation: bat-fly linear infinite;
      filter: hue-rotate(-30deg) saturate(1.5) brightness(1.1);
    }
    @keyframes bat-fly {
      0% { transform: translateX(-60px) translateY(0); }
      100% { transform: translateX(calc(100vw + 60px)) translateY(0); }
    }
  </style>
</head>
  <body class="min-h-screen flex flex-col items-center justify-center px-4 py-6 sm:px-6 sm:py-8 overflow-hidden relative" style="background: linear-gradient(135deg, #fce7f3 0%, #fef3c7 35%, #e9d5ff 70%, #fbcfe8 100%);">
  <!-- Background: sparkles -->
  <div id="sparkles" class="absolute inset-0 pointer-events-none" aria-hidden="true"></div>
  <!-- Background: falling hearts -->
  <div id="hearts" class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true"></div>
  <!-- Background: flying bats -->
  <div id="bats" class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true"></div>

  <main class="flex flex-col items-center gap-6 sm:gap-8 max-w-md sm:max-w-xl md:max-w-2xl w-full relative z-10">
    <div class="w-56 h-56 sm:w-72 sm:h-72 md:w-80 md:h-80 rounded-2xl overflow-hidden shadow-xl bg-white/30 flex items-center justify-center flex-shrink-0">
      <img
        src="assets/bat-valentine.png"
        alt="Cute sparkly bat"
        class="w-full h-full object-cover"
      />
    </div>

    <p class="text-3xl sm:text-4xl md:text-5xl font-barbie text-rose-700 text-center leading-tight px-2">
      Will you be my valentine?
    </p>

    <div id="btn-container" class="relative flex flex-col sm:flex-row justify-center items-center gap-4 sm:gap-16 min-h-[12rem] sm:min-h-[14rem] md:min-h-[16rem] relative w-full">
      <div class="flex justify-center sm:justify-end w-full sm:w-28">
        <button
          type="button"
          id="yes-btn"
          class="yes-btn-grow px-10 py-3.5 text-lg rounded-full bg-rose-500 text-white font-barbie font-medium shadow-lg hover:bg-rose-600 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:ring-offset-2"
          style="--yes-scale: 1;"
        >
          Yes
        </button>
      </div>
      <div id="no-btn-slot" class="flex justify-center sm:justify-start w-full sm:w-28 min-h-[3.5rem] flex-shrink-0 overflow-visible">
        <button
          type="button"
          id="no-btn"
          class="no-btn-runaway absolute px-10 py-3.5 text-lg rounded-full bg-slate-300 text-slate-700 font-barbie font-medium shadow hover:bg-slate-400 focus:outline-none"
        >
          No
        </button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const yesBtn = document.getElementById('yes-btn');
      const noBtn = document.getElementById('no-btn');
      const container = document.getElementById('btn-container');
      if (!yesBtn || !noBtn || !container) return;

      const SETTINGS = {
        stages: 4,
        triggerRadius: 170,
        yesScalePerStage: 0.3,
        containerPadding: 8,
        noOverlapGap: 12,
        maxPositionAttempts: 24,
      };

      const isTouchDevice =
        ('ontouchstart' in window) ||
        (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

      let stage = 0;
      let yesScale = 1;
      let noInitialized = false;
      let isNearNo = false;
      let rafScheduled = false;

      function getRectRelativeToContainer(targetRect, containerRect) {
        return {
          left: targetRect.left - containerRect.left,
          top: targetRect.top - containerRect.top,
          right: targetRect.right - containerRect.left,
          bottom: targetRect.bottom - containerRect.top,
          width: targetRect.width,
          height: targetRect.height,
        };
      }

      function intersects(rectA, rectB) {
        return !(
          rectA.right <= rectB.left ||
          rectA.left >= rectB.right ||
          rectA.bottom <= rectB.top ||
          rectA.top >= rectB.bottom
        );
      }

      function isFarEnoughFromPointer(x, y, noWidth, noHeight, pointerX, pointerY, containerRect) {
        if (typeof pointerX !== 'number' || typeof pointerY !== 'number') return true;
        const centerX = containerRect.left + x + noWidth / 2;
        const centerY = containerRect.top + y + noHeight / 2;
        const dx = pointerX - centerX;
        const dy = pointerY - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        return distance >= SETTINGS.triggerRadius * 0.75;
      }

      function canPlaceNoButton(x, y, pointerX, pointerY) {
        const containerRect = container.getBoundingClientRect();
        const noWidth = noBtn.offsetWidth;
        const noHeight = noBtn.offsetHeight;

        const candidate = {
          left: x,
          top: y,
          right: x + noWidth,
          bottom: y + noHeight,
        };

        const yesRect = yesBtn.getBoundingClientRect();
        const yesInContainer = getRectRelativeToContainer(yesRect, containerRect);
        const yesSafeZone = {
          left: yesInContainer.left - SETTINGS.noOverlapGap,
          top: yesInContainer.top - SETTINGS.noOverlapGap,
          right: yesInContainer.right + SETTINGS.noOverlapGap,
          bottom: yesInContainer.bottom + SETTINGS.noOverlapGap,
        };

        if (intersects(candidate, yesSafeZone)) return false;
        return isFarEnoughFromPointer(x, y, noWidth, noHeight, pointerX, pointerY, containerRect);
      }

      function placeNoButton(x, y) {
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
        noBtn.style.transform = 'translate(0, 0)';
      }

      function moveNoToRandomPosition(pointerX, pointerY) {
        const containerRect = container.getBoundingClientRect();
        const noWidth = noBtn.offsetWidth;
        const noHeight = noBtn.offsetHeight;
        const minX = SETTINGS.containerPadding;
        const minY = SETTINGS.containerPadding;
        const maxX = containerRect.width - noWidth - SETTINGS.containerPadding;
        const maxY = containerRect.height - noHeight - SETTINGS.containerPadding;

        if (maxX <= minX || maxY <= minY) return;

        let attempt = 0;

        while (attempt < SETTINGS.maxPositionAttempts) {
          const x = minX + Math.random() * (maxX - minX);
          const y = minY + Math.random() * (maxY - minY);

          if (canPlaceNoButton(x, y, pointerX, pointerY)) {
            placeNoButton(x, y);
            return;
          }

          attempt++;
        }

        const step = 12;
        let y = minY;
        while (y <= maxY) {
          let x = minX;
          while (x <= maxX) {
            if (canPlaceNoButton(x, y, pointerX, pointerY)) {
              placeNoButton(x, y);
              return;
            }
            x = x + step;
          }
          y = y + step;
        }
      }

      function getNoCenterDistance(pointerX, pointerY) {
        const noRect = noBtn.getBoundingClientRect();
        const centerX = noRect.left + noRect.width / 2;
        const centerY = noRect.top + noRect.height / 2;
        const dx = pointerX - centerX;
        const dy = pointerY - centerY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function advanceStage() {
        if (stage >= SETTINGS.stages) return;

        stage++;
        yesScale = 1 + stage * SETTINGS.yesScalePerStage;
        yesBtn.style.setProperty('--yes-scale', yesScale);
        yesBtn.style.transform = 'scale(' + yesScale + ')';

        yesBtn.classList.remove('yes-sparkle', 'yes-sparkle-more', 'yes-shake');
        if (stage >= 2) yesBtn.classList.add('yes-sparkle');
        if (stage >= 3) {
          yesBtn.classList.remove('yes-sparkle');
          yesBtn.classList.add('yes-sparkle-more');
        }
        if (stage >= 4) {
          yesBtn.classList.remove('yes-sparkle-more');
          yesBtn.classList.add('yes-shake');
        }

        if (stage >= SETTINGS.stages) {
          noBtn.style.opacity = '0';
          noBtn.style.pointerEvents = 'none';
        }
      }

      function initNoPosition() {
        if (noInitialized) return;
        // Start from CSS-defined position (next to "Yes"), do not move yet.
        noInitialized = true;
      }

      function triggerNoEscape(pointerX, pointerY) {
        initNoPosition();
        moveNoToRandomPosition(pointerX, pointerY);
        if (!isNearNo) {
          isNearNo = true;
          advanceStage();
        }
      }

      function handleMouseMove(event) {
        if (rafScheduled) return;
        rafScheduled = true;

        requestAnimationFrame(function () {
          rafScheduled = false;
          initNoPosition();

          const distance = getNoCenterDistance(event.clientX, event.clientY);
          const isNear = distance < SETTINGS.triggerRadius;
          if (isNear) {
            triggerNoEscape(event.clientX, event.clientY);
          } else {
            isNearNo = false;
          }
        });
      }

      if (!isTouchDevice) {
        container.addEventListener('mousemove', handleMouseMove);

        noBtn.addEventListener('mouseenter', function (event) {
          triggerNoEscape(event.clientX, event.clientY);
        });

        noBtn.addEventListener('mouseleave', function () {
          isNearNo = false;
        });
      } else {
        noBtn.addEventListener('touchstart', function (event) {
          const touch = event.touches && event.touches.length > 0 ? event.touches[0] : null;
          if (touch) {
            triggerNoEscape(touch.clientX, touch.clientY);
          } else {
            triggerNoEscape();
          }
          isNearNo = false;
          event.preventDefault();
        }, { passive: false });
      }

      noBtn.addEventListener('click', function (event) {
        event.preventDefault();
      });

      yesBtn.addEventListener('click', function () {
        alert('Yay! Happy valentine\'s! 💕');
      });

      initNoPosition();

      // More sparkles
      const sparklesEl = document.getElementById('sparkles');
      const sparkleCount = 56;
      for (let i = 0; i < sparkleCount; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 2) + 's';
        sparklesEl.appendChild(s);
      }

      // Falling hearts - start immediately (negative delay = already in motion)
      const heartsEl = document.getElementById('hearts');
      const heartSymbols = ['♥', '❤', '💕'];
      const heartCount = 14;
      for (let i = 0; i < heartCount; i++) {
        const h = document.createElement('span');
        h.className = 'heart-fall';
        h.textContent = heartSymbols[i % heartSymbols.length];
        h.style.left = Math.random() * 100 + '%';
        const duration = 14 + Math.random() * 8;
        h.style.animationDuration = duration + 's';
        h.style.animationDelay = -(Math.random() * duration) + 's';
        h.style.fontSize = (0.8 + Math.random() * 0.5) + 'rem';
        h.style.color = ['#e11d48', '#fb7185', '#f472b6'][i % 3];
        heartsEl.appendChild(h);
      }

      // Flying pink bats
      const batsEl = document.getElementById('bats');
      const batCount = 8;
      for (let i = 0; i < batCount; i++) {
        const b = document.createElement('span');
        b.className = 'bat-fly';
        b.textContent = '🦇';
        b.style.top = (10 + Math.random() * 80) + '%';
        b.style.animationDuration = (18 + Math.random() * 10) + 's';
        b.style.animationDelay = (Math.random() * -25) + 's';
        batsEl.appendChild(b);
      }
    })();
  </script>
</body>
</html>
